name: Bug report
description: Something in the game or pipeline is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - "study-saga.pages.dev (production)"
        - "Local wrangler pages dev"
        - "Local Flask (backend/app.py)"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 128 on Android, Safari on iOS
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console errors, screenshots, whatever's useful.
